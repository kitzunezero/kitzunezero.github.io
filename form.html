<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
<form action="register_account.html" method="post" id="registration_form"> 
    <fieldset>
        <legend>Registration Information</legend>
        <label for="email">E-Mail:</label>
        <input type="email" name="email" id="email"
            autofocus required autocomplete="on"><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required
            placeholder="At least 6 letters or numbers" 
            pattern="[a-zA-Z0-9]{6,}"
            title="Must be at least 6 alphanumeric characters">
        <br>
        <label for="verify">Verify Password:</label>
        <input type="password" name="verify" id="verify" required><br>
    </fieldset>
    <fieldset>
        <legend>Member Information</legend>
        <label for="first_name">First Name:</label>
        <input type="text" name="first_name" id="first_name"
            required autocomplete="on"><br>        
        <label for="state">State:</label>
        <input type="text" name="state" id="state" required 
            maxlength="2" 
            placeholder="2-character code"
            autocomplete="on"><br>
        <label for="zip">ZIP Code:</label>
        <input type="text" name="zip" id="zip" required
            placeholder="5 or 9 digits" 
            pattern="^\d{5}(-\d{4})?$"
            title="Either 5 or 9 digits"
            autocomplete="on"><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" name="phone" id="phone"
            placeholder="999-999-9999" 
            pattern="\d{3}[\-]\d{3}[\-]\d{4}" 
            title="Must be 999-999-999 format"
            autocomplete="on"><br>
    </fieldset>
    <fieldset>
        <legend>Membership Information</legend>
        <label for="membershiptype">Membership Type:</label>
        <select name="MembershipType" id="MembershipType">
            <option value="junior">Junior</option>
            <option value="regular">Regular</option>
            <option value="charter">Charter</option>
        </select> <br>
        <label for="startingdate">Starting Date:</label>
        <input type="date" name="startingdate" id="startingdate" required><br>
        <label for="tickets">Tickets for Guests:</label> 
        <input type="number" name="tickets" id="tickets" min="1" max="4" value="2"> <br>
    </fieldset>
    <fieldset>
        <legend>How Did You Hear About Us?</legend>
        <input type="checkbox" name="SearchEngine" id="hearab1" value="search">
        <label for="search">Search engine</label><br>
        <input type="checkbox" name="Social" id="hearab2" value="social">
        <label for="social">Social Media</label><br>
        <input type="checkbox" name="Email" id="hearab3" value="email">
        <label for="email">Email</label><br>
        <input type="checkbox" name="FriendOrColleague" id="hearab4" value="friendorcolleague">
        <label for="friendorcolleague">Friend or colleague</label><br>
    </fieldset>
</form>
</body>
</html>
